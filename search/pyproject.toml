[project]
name = "yee-search"
version = "0.1.0"
description = "Searches for voting methods built from yee-lab's blocks that resist burial"
requires-python = ">=3.13,<3.15"  # as yee-lab: numba 0.67 does not support 3.15
dependencies = [
    "numpy>=2.4.6",
    "pebble>=5.1.0",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.27.2",
    "yee-lab",
]

[project.scripts]
yee-search = "yeesearch.cli:app"

[tool.uv.sources]
yee-lab = { path = "..", editable = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yeesearch"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
