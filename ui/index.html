<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yee diagram</title>
  <!-- KaTeX 0.18.9 (MIT), bundled in ui/vendor so the page also works offline -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script src="vendor/katex/katex.min.js"></script>
  <!-- uPlot 1.6.32 (MIT), for the voter distribution strip -->
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <script src="vendor/uplot/uPlot.iife.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; color: #222; background: #fff; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    /* diagram on the left, controls on the right; stacked on narrow screens */
    .layout { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2rem; }
    .diagram { flex: 1 1 420px; max-width: 720px; }
    .controls { flex: 1 1 300px; }
    /* the square and the voter strip above it, placed by layout() in the script */
    .joint { position: relative; }
    .joint > * { position: absolute; }
    /* opaque, so the voter density shade behind it only shows around it */
    #square { box-sizing: border-box; border: 1px solid #222; background: #fff; cursor: crosshair; touch-action: none; }
    .choices { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0 0 1rem; }
    .choices > span { font-size: .9rem; color: #666; }  /* row labels only, not KaTeX spans */
    button { font: inherit; padding: .4rem .9rem; border: 1px solid #222; border-radius: 4px; background: #fff; cursor: pointer; }
    button.active { background: #222; color: #fff; }
    button:disabled { opacity: .35; cursor: default; }
    p { margin: .25rem 0; font-size: .9rem; color: #666; }
    .katex { font-size: 1.05em; }
  </style>
</head>
<body>
  <h1>Yee diagram</h1>
  <div class="layout">
    <div class="diagram joint" id="joint">
      <canvas id="square" width="1000" height="1000"></canvas>
    </div>
    <div class="controls">
      <div class="choices" id="distributions"><span>Voters:</span></div>
      <div class="choices" id="deviations"><span>Deviation:</span></div>
      <div class="choices" id="spreads"><span>Beta spread fixed:</span></div>
      <div class="choices" id="methods"></div>
      <p>Drag a candidate to move it · click empty space to add one · right-click to remove</p>
      <p>Hover the square to see the voters of a pixel in 2D and along x (above)</p>
      <p id="voters"></p>
      <p id="message">Pick a method.</p>
    </div>
  </div>

  <script type="module">
    // matplotlib's tab20, the colours plot.py uses, so the UI matches plots/
    const COLORS = ["#1f77b4", "#aec7e8", "#ff7f0e", "#ffbb78", "#2ca02c", "#98df8a", "#d62728",
      "#ff9896", "#9467bd", "#c5b0d5", "#8c564b", "#c49c94", "#e377c2", "#f7b6d2", "#7f7f7f",
      "#c7c7c7", "#bcbd22", "#dbdb8d", "#17becf", "#9edae5"];
    const RGB = COLORS.map(hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)));
    const RADIUS = 14;  // candidate dot, in canvas pixels

    const canvas = document.getElementById("square");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const methods = document.getElementById("methods");
    const distributions = document.getElementById("distributions");
    const spreads = document.getElementById("spreads");
    const deviations = document.getElementById("deviations");
    const joint = document.getElementById("joint");
    const votersText = document.getElementById("voters");
    // each curve is scaled so its peak sits at 1 / HEADROOM of the strip, whatever its height
    const HEADROOM = 1.1;
    const SAMPLES = 500;    // points per density curve
    const OVERHANG = 0.15;  // the strip reaches this far beyond the square (normal voters can leave it)
    const STRIP = 0.2;      // thickness of the strip's plot, as a fraction of the square
    const AXIS = 28;        // CSS px for the 0, 0.5, 1 labels above the strip
    const DROP = 16;        // CSS px between the strip and the square's surroundings
    const POSITIONS = Array.from({ length: SAMPLES },
      (_, i) => -OVERHANG + (i + 0.5) / SAMPLES * (1 + 2 * OVERHANG));
    // 2D voter density while hovering, as a dark shade over [-OVERHANG, 1 + OVERHANG]², so normal
    // voters outside the square show too. Computed on a grid of DENSITY_GRID points per unit and
    // smoothed up. DENSITY_TOP (the normal peak is 1.13) and higher get opacity DENSITY_ALPHA;
    // below, the opacity falls like density^DENSITY_GAMMA, which lifts the low densities.
    const DENSITY_GRID = 200;
    const DENSITY_EDGE = Math.round(OVERHANG * DENSITY_GRID);  // grid points outside on each side
    const DENSITY_SIZE = DENSITY_GRID + 2 * DENSITY_EDGE;
    const DENSITY_TOP = 1.2;
    const DENSITY_ALPHA = 0.8;
    const DENSITY_GAMMA = 0.6;
    // near-black with the opacity of each density level; more levels than 8 bits, as the power
    // makes the steps near 0 large
    const DENSITY_COLORS = Array.from({ length: 1024 }, (_, level) =>
      [20, 20, 20, 255 * DENSITY_ALPHA * (level / 1023) ** DENSITY_GAMMA]);
    // The whole shade, shown behind the square with CSS smoothing it up; the part inside the
    // square is drawn by draw(), between the diagram and the candidates.
    const densityCanvas = document.createElement("canvas");
    densityCanvas.width = densityCanvas.height = DENSITY_SIZE;
    Object.assign(densityCanvas.style, { pointerEvents: "none", visibility: "hidden" });
    canvas.before(densityCanvas);
    // up to half a level of noise per grid point, so that 256 levels show no rings where the
    // density is nearly flat; fixed, so the image does not flicker while the mouse moves
    const DITHER = Float32Array.from({ length: DENSITY_SIZE ** 2 }, () => Math.random() - 0.5);

    let candidates = [];  // [[x, y], ...] in the unit square, y pointing up
    let maxCandidates = 0;
    let pixels = 0;       // the backend's diagram is pixels x pixels
    let method = null;    // name of the selected method
    let distribution = null;  // name of the selected voter distribution
    let spread = null;    // name of the selected Beta spread rule
    let spreadInfo = {};  // spread name -> {label, tex, description} from the backend
    let deviation = 0;    // mean absolute deviation of the voters from their pixel; 0 = all at it
    let voters = {};      // deviation above 0 -> {sigma, beta_params} from the backend, where
                          // beta_params is spread name -> [a, b] along one axis, per pixel
    let hovered = [0.5, 0.5];  // point whose pixel's voters are shown in the strip and the shade
    let showDensity = false;   // their 2D density over the square, while hovering it
    let diagram = null;   // last computed diagram as an image, or null
    let dragged = -1;     // index of the candidate being dragged
    let requestId = 0;    // answers to older requests are ignored

    // Unit square has y up, the canvas has y down.
    const clamp = v => Math.min(1, Math.max(0, v));
    const toCanvas = ([x, y]) => [x * canvas.width, (1 - y) * canvas.height];
    function toUnit(event) {
      const box = canvas.getBoundingClientRect();
      return [clamp((event.clientX - box.left) / box.width), clamp(1 - (event.clientY - box.top) / box.height)];
    }

    function candidateAt(point) {
      const [px, py] = toCanvas(point);
      return candidates.findLastIndex(c => {
        const [x, y] = toCanvas(c);
        return Math.hypot(x - px, y - py) <= RADIUS + 6;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (diagram) {
        ctx.imageSmoothingEnabled = false;  // sharp pixel borders, like interpolation="nearest"
        ctx.drawImage(diagram, 0, 0, canvas.width, canvas.height);
      }
      densityCanvas.style.visibility = showDensity ? "visible" : "hidden";  // the part around the square
      if (showDensity) {  // the part of the voter density inside the square
        ctx.imageSmoothingEnabled = true;  // smooth, unlike the diagram
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(densityCanvas, DENSITY_EDGE, DENSITY_EDGE, DENSITY_GRID, DENSITY_GRID,
          0, 0, canvas.width, canvas.height);
      }
      candidates.forEach((candidate, i) => {
        const [x, y] = toCanvas(candidate);
        ctx.beginPath();
        ctx.arc(x, y, RADIUS, 0, 2 * Math.PI);
        ctx.fillStyle = COLORS[i];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";
        ctx.stroke();
      });
    }

    // log Γ(z) for z > 0 (Lanczos, g = 7, with the reflection formula below 1/2)
    const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
      -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    function lgamma(z) {
      if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
      z -= 1;
      let sum = LANCZOS[0];
      for (let i = 1; i < LANCZOS.length; i++) sum += LANCZOS[i] / (z + i);
      const t = z + 7.5;
      return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(sum);
    }

    // Voters of pixel k along one axis: median m (the pixel centre, as in the backend), pdf and a label.
    function voterDensity(k) {
      const m = (k + 0.5) / pixels;
      if (deviation === 0) return { m, text: `δ(${m.toFixed(3)})`, pdf: () => null };  // all at m: no curve
      const { sigma, beta_params } = voters[deviation];
      if (distribution === "beta") {
        const [a, b] = beta_params[spread][k];
        const logB = lgamma(a) + lgamma(b) - lgamma(a + b);
        return {
          m, text: `Beta(${a.toFixed(3)}, ${b.toFixed(3)})`,
          pdf: x => x <= 0 || x >= 1 ? null : Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log1p(-x) - logB),
        };
      }
      return {  // normal voters can leave the square
        m, text: `N(${m.toFixed(3)}, ${sigma.toFixed(3)}²)`,
        pdf: x => Math.exp(-0.5 * ((x - m) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI)),
      };
    }

    // A uPlot strip of the voter density along x, above the square, with density 0 at the bottom.
    function voterStrip() {
      let median = 0.5;
      // vertical lines at positions `at` along x, in canvas pixels
      function across(u, at, style, dash = []) {
        const { ctx, bbox } = u;
        ctx.save();
        ctx.strokeStyle = style;
        ctx.lineWidth = devicePixelRatio;
        ctx.setLineDash(dash.map(d => d * devicePixelRatio));
        for (const v of at) {
          const p = Math.round(u.valToPos(v, "x", true)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(p, bbox.top);
          ctx.lineTo(p, bbox.top + bbox.height);
          ctx.stroke();
        }
        ctx.restore();
      }
      // grey outside the square, where only normal voters go
      function shadeOutside(u) {
        const { ctx, bbox } = u;
        ctx.save();
        ctx.fillStyle = "#f6f6f6";
        for (const [from, to] of [[-OVERHANG, 0], [1, 1 + OVERHANG]]) {
          const [p, q] = [from, to].map(v => u.valToPos(v, "x", true));
          ctx.fillRect(Math.min(p, q), bbox.top, Math.abs(q - p), bbox.height);
        }
        ctx.restore();
      }
      const plot = new uPlot({
        width: 100, height: 100,  // set by layout()
        padding: [0, 0, 0, 0],
        legend: { show: false },
        cursor: { show: false, drag: { x: false, y: false } },
        select: { show: false },
        scales: {
          x: { time: false, auto: false, range: [-OVERHANG, 1 + OVERHANG] },
          y: { auto: false, range: [0, HEADROOM] },  // density over its peak
        },
        axes: [
          {
            side: 0, size: AXIS, gap: 3,
            splits: () => [0, 0.5, 1], values: (u, splits) => splits.map(String),
            font: "11px system-ui, sans-serif", stroke: "#888",
            grid: { show: false }, ticks: { size: 4, width: 1, stroke: "#ccc" },
          },
          { show: false },
        ],
        // pxAlign: 0 keeps sub-pixel positions; uPlot rounds to whole pixels by default, which
        // draws a nearly flat curve as steps
        series: [{}, { stroke: "#555", width: 1.5, fill: "rgba(0, 0, 0, 0.07)", points: { show: false }, pxAlign: 0 }],
        hooks: {
          drawClear: [shadeOutside],
          draw: [u => {
            across(u, [0, 1], "#ccc");  // edges of the square
            across(u, [median], "#999", [4, 3]);
          }],
        },
      }, [POSITIONS, POSITIONS.map(() => null)], joint);
      return {
        plot,
        show({ m, pdf }) {
          median = m;
          // over the highest sample, so the whole curve fits; Beta with a or b < 1 is infinite
          // at the walls, but its samples are not
          const density = POSITIONS.map(pdf);
          const peak = Math.max(...density.filter(Number.isFinite));  // Beta is null outside
          plot.setData([POSITIONS, density.map(d => d === null || !(peak > 0) ? d : d / peak)]);
        },
      };
    }
    const stripX = voterStrip();

    // The 2D density of voters X, Y into densityCanvas. They are independent, so it is f(x) g(y).
    function fillDensity(x, y) {
      const along = ({ pdf }) => Array.from({ length: DENSITY_SIZE },
        (_, i) => pdf((i - DENSITY_EDGE + 0.5) / DENSITY_GRID) ?? 0);  // Beta is null outside
      const [f, g] = [along(x), along(y)];
      const top = DENSITY_COLORS.length - 1;
      const image = new ImageData(DENSITY_SIZE, DENSITY_SIZE);
      for (let row = 0; row < DENSITY_SIZE; row++) {
        const gy = g[DENSITY_SIZE - 1 - row];  // rows go top to bottom
        for (let col = 0; col < DENSITY_SIZE; col++) {
          const k = row * DENSITY_SIZE + col;
          const level = Math.round(top * Math.min(1, f[col] * gy / DENSITY_TOP) + DITHER[k]);
          image.data.set(DENSITY_COLORS[Math.min(top, Math.max(0, level))], 4 * k);
        }
      }
      densityCanvas.getContext("2d").putImageData(image, 0, 0);
    }

    // Voters of the hovered pixel along x (above the square) and in 2D over the square.
    // Redraws the square.
    function drawVoters() {
      const pixel = v => Math.min(pixels - 1, Math.floor(v * pixels));
      const [x, y] = hovered.map(v => voterDensity(pixel(v)));
      stripX.show(x);
      votersText.textContent = `Voters at (${x.m.toFixed(3)}, ${y.m.toFixed(3)}): X ~ ${x.text}, Y ~ ${y.text}`;
      if (showDensity) fillDensity(x, y);
      draw();
    }

    // Place the square and the strip so that the strip's 0 and 1 line up with the square's edges.
    // The strip reaches OVERHANG beyond the square at both ends, so the square keeps that much
    // space around it, where the 2D density shows too, and DROP more between that and the strip.
    function layout() {
      const span = joint.clientWidth;          // length of the strip
      const side = span / (1 + 2 * OVERHANG);
      const thick = side * STRIP + AXIS;       // thickness of the strip with its labels
      const gap = side * OVERHANG;
      const top = thick + DROP;                // of the square's surroundings
      const place = (element, left, top, width, height) =>
        Object.assign(element.style, { left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` });
      place(canvas, gap, top + gap, side, side);
      place(densityCanvas, 0, top, span, span);
      place(stripX.plot.root, 0, 0, span, thick);
      stripX.plot.setSize({ width: span, height: thick });
      joint.style.height = `${top + span}px`;
    }
    new ResizeObserver(layout).observe(joint);

    // Ask the backend for the winner of every pixel and turn it into an image.
    async function compute() {
      const id = ++requestId;
      if (!method) return;
      if (candidates.length < 2) {
        message.textContent = "Add at least 2 candidates.";
        return;
      }
      message.textContent = `Computing ${method}…`;
      const start = performance.now();
      try {
        const response = await fetch("/api/diagram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ candidates, method, distribution, spread, deviation }),
        });
        if (!response.ok) throw new Error(await response.text());
        // one byte per pixel, rows top to bottom
        const winners = new Uint8Array(await response.arrayBuffer());
        if (winners.length !== pixels * pixels) throw new Error(`expected ${pixels}² pixels, got ${winners.length}`);
        const image = new ImageData(pixels, pixels);
        // winner 255 means a Condorcet cycle, drawn black
        winners.forEach((winner, k) => image.data.set([...(RGB[winner] ?? [0, 0, 0]), 255], 4 * k));
        const bitmap = await createImageBitmap(image);
        if (id !== requestId) return;  // candidates changed meanwhile, a newer answer is coming
        diagram = bitmap;
        draw();
        const tail = ` · ${candidates.length} candidates · ${Math.round(performance.now() - start)} ms`;
        if (method === "voronoi") {  // nearest candidate, no voters involved
          message.textContent = `voronoi${tail}`;
        } else if (deviation === 0) {
          message.textContent = `${method} · deviation 0: every voter at their pixel, so voronoi${tail}`;
        } else if (distribution === "beta") {
          const formula = document.createElement("span");
          typeset(formula, spreadInfo[spread]);
          message.replaceChildren(`${method} · beta voters, deviation ${deviation}, `, formula, tail);
        } else {
          message.textContent = `${method} · ${distribution} voters, deviation ${deviation}${tail}`;
        }
      } catch (error) {
        if (id === requestId) message.textContent = `Error: ${error.message}`;
      }
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;  // left button only, right-click removes
      const point = toUnit(event);
      dragged = candidateAt(point);
      if (dragged === -1) {
        if (candidates.length >= maxCandidates) {
          message.textContent = `At most ${maxCandidates} candidates.`;
          return;
        }
        candidates.push(point);
        dragged = candidates.length - 1;
      }
      canvas.setPointerCapture(event.pointerId);  // keep getting moves outside the canvas
      showDensity = false;
      draw();
    });

    canvas.addEventListener("pointermove", event => {
      hovered = toUnit(event);
      if (dragged !== -1) candidates[dragged] = hovered;
      showDensity = dragged === -1;  // not while dragging, so the diagram stays visible
      drawVoters();
    });

    canvas.addEventListener("pointerleave", () => {
      showDensity = false;
      draw();
    });

    function drop() {
      if (dragged === -1) return;
      dragged = -1;
      compute();
    }
    canvas.addEventListener("pointerup", drop);
    canvas.addEventListener("pointercancel", drop);

    canvas.addEventListener("contextmenu", event => {
      event.preventDefault();
      const i = candidateAt(toUnit(event));
      if (i === -1) return;
      candidates.splice(i, 1);
      diagram = null;  // colours follow the index, which just shifted
      draw();
      compute();
    });

    // Typeset a {label, tex} option with KaTeX, or show the plain label if it fails.
    function typeset(element, { label, tex }) {
      try {
        katex.render(tex, element, { throwOnError: true });
      } catch {
        element.textContent = label;
      }
    }

    // A row of buttons of which one is active; picking one recomputes the diagram.
    // options: [{name, label, tex, description}], all but name optional.
    function choices(row, options, pick) {
      for (const { name, label = name, tex, description = "" } of options) {
        const button = document.createElement("button");
        if (tex) typeset(button, { label, tex });
        else button.textContent = label;
        button.title = description;
        button.addEventListener("click", () => {
          pick(name);
          for (const b of row.querySelectorAll("button")) b.classList.toggle("active", b === button);
          compute();
        });
        row.append(button);
      }
    }
    const named = names => names.map(name => ({ name }));

    // The spread rules only apply to Beta voters that spread at all.
    function updateSpreads() {
      for (const button of spreads.querySelectorAll("button")) button.disabled = distribution !== "beta" || deviation === 0;
    }

    // Start: default candidates, distributions and method names come from the backend.
    const config = await (await fetch("/api/config")).json();
    candidates = config.candidates;
    maxCandidates = config.max_candidates;
    pixels = config.pixels;
    spreadInfo = Object.fromEntries(config.spreads.map(info => [info.name, info]));
    voters = Object.fromEntries(config.voters.map(({ deviation, ...rest }) => [deviation, rest]));
    choices(distributions, named(config.distributions), name => { distribution = name; updateSpreads(); drawVoters(); });
    choices(deviations, config.deviations.map(d => ({
      name: d, label: d === 0 ? "0 (voronoi)" : String(d),
      description: d === 0 ? "Every voter at their pixel: every method draws the Voronoi diagram" :
        `Voters at a mean distance of ${d} from their pixel along each axis (at the centre pixel for Beta)`,
    })), d => { deviation = d; updateSpreads(); drawVoters(); });
    choices(spreads, config.spreads, name => { spread = name; drawVoters(); });
    choices(methods, named(config.methods), name => method = name);
    distribution = config.distributions[0];
    distributions.querySelector("button").classList.add("active");
    spread = config.spreads[0].name;
    spreads.querySelector("button").classList.add("active");
    deviation = config.deviation;
    deviations.querySelectorAll("button")[config.deviations.indexOf(deviation)].classList.add("active");
    updateSpreads();
    draw();
    drawVoters();
  </script>
</body>
</html>
