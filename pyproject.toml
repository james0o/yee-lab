[project]
name = "yee-lab"
version = "0.4.0"
description = "Yee diagrams for comparing voting systems with Beta-distributed voters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "contourpy>=1.3.3",
    "fastapi[standard]>=0.141.1",
    "matplotlib>=3.10.9",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.build-backend]
module-name = "yeelab"  # the project is yee-lab, but a package name cannot have a hyphen
# output of the pixel pipeline, not part of the package
source-exclude = ["src/yeelab/pixels/cache", "src/yeelab/pixels/plots"]
wheel-exclude = ["yeelab/pixels/cache", "yeelab/pixels/plots"]

[tool.fastapi]
entrypoint = "yeelab.web.app:app"
