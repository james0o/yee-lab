<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yee diagram</title>
  <!-- KaTeX 0.18.9 (MIT), bundled in ui/vendor so the page also works offline -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script src="vendor/katex/katex.min.js"></script>
  <!-- uPlot 1.6.32 (MIT), for the voter distribution strip -->
  <link rel="stylesheet" href="vendor/uplot/uPlot.min.css">
  <script src="vendor/uplot/uPlot.iife.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; color: #222; background: #fff; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    /* diagram on the left, controls on the right; stacked on narrow screens */
    .layout { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2rem; }
    .diagram { flex: 1 1 420px; max-width: 720px; }
    .controls { flex: 1 1 300px; }
    /* the square and the voter strip above it, placed by layout() in the script */
    .joint { position: relative; }
    .joint > * { position: absolute; }
    /* opaque, so the voter density shade behind it only shows around it */
    #square { box-sizing: border-box; border: 1px solid #222; background: #fff; cursor: crosshair; touch-action: none; }
    .choices { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: 0 0 1rem; }
    .choices > span { font-size: .9rem; color: #666; }  /* row labels only, not KaTeX spans */
    .choices > label { font-size: .9rem; display: flex; align-items: center; gap: .3rem; cursor: pointer; }
    .choices input[type=checkbox] { accent-color: #222; margin: 0; }
    #deviation, #levels { width: 12rem; accent-color: #222; }
    #deviationValue, #levelsValue { font-size: .9rem; min-width: 6rem; }
    button { font: inherit; padding: .4rem .9rem; border: 1px solid #222; border-radius: 4px; background: #fff; cursor: pointer; }
    button.active { background: #222; color: #fff; }
    button:disabled { opacity: .35; cursor: default; }
    p { margin: .25rem 0; font-size: .9rem; color: #666; }
    .katex { font-size: 1.05em; }
  </style>
</head>
<body>
  <h1>Yee diagram</h1>
  <div class="layout">
    <div class="diagram joint" id="joint">
      <canvas id="square" width="1000" height="1000"></canvas>
    </div>
    <div class="controls">
      <div class="choices" id="distributions"><span>Voters:</span></div>
      <div class="choices"><span>Show voters:</span>
        <label><input type="checkbox" id="showMarginal" checked>marginal distribution of x</label>
        <label><input type="checkbox" id="showJoint" checked>joint distribution</label>
      </div>
      <div class="choices"><span>Deviation:</span><input type="range" id="deviation"><output id="deviationValue"></output></div>
      <div class="choices" id="pixelMedians"><span>Pixel is:</span></div>
      <div class="choices" id="methods"><span>Voting method:</span></div>
      <div class="choices"><span>Score categories:</span><input type="range" id="levels" min="2" step="1"><output id="levelsValue"></output></div>
      <div class="choices" id="ideals"><span>Ideal scenario:</span></div>
      <p>Drag a candidate to move it · click empty space to add one · right-click to remove</p>
      <p>Hover the square to see the voters of a pixel along x (above) and in 2D</p>
      <p id="voters"></p>
      <p id="message">Pick a method.</p>
    </div>
  </div>

  <script type="module">
    // matplotlib's tab20, the colours pixels/plot.py uses, so the UI matches its PNGs
    const COLORS = ["#1f77b4", "#aec7e8", "#ff7f0e", "#ffbb78", "#2ca02c", "#98df8a", "#d62728",
      "#ff9896", "#9467bd", "#c5b0d5", "#8c564b", "#c49c94", "#e377c2", "#f7b6d2", "#7f7f7f",
      "#c7c7c7", "#bcbd22", "#dbdb8d", "#17becf", "#9edae5"];
    const RADIUS = 14;  // candidate dot, in canvas pixels

    const canvas = document.getElementById("square");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const methods = document.getElementById("methods");
    const ideals = document.getElementById("ideals");
    const distributions = document.getElementById("distributions");
    const pixelMedians = document.getElementById("pixelMedians");
    const deviationSlider = document.getElementById("deviation");
    const deviationValue = document.getElementById("deviationValue");
    const levelsSlider = document.getElementById("levels");
    const levelsValue = document.getElementById("levelsValue");
    const joint = document.getElementById("joint");
    const votersText = document.getElementById("voters");
    const showMarginal = document.getElementById("showMarginal");  // the strip above the square
    const showJoint = document.getElementById("showJoint");        // the shade over it while hovering
    // each curve is scaled so its peak sits at 1 / HEADROOM of the strip, whatever its height
    const HEADROOM = 1.1;
    const SAMPLES = 500;    // points per density curve
    const OVERHANG = 0.15;  // the strip reaches this far beyond the square (normal voters can leave it)
    const STRIP = 0.2;      // thickness of the strip's plot, as a fraction of the square
    const AXIS = 28;        // CSS px for the 0, 0.5, 1 labels above the strip
    const DROP = 16;        // CSS px between the strip and the square's surroundings
    const POSITIONS = Array.from({ length: SAMPLES },
      (_, i) => -OVERHANG + (i + 0.5) / SAMPLES * (1 + 2 * OVERHANG));
    // 2D voter density while hovering, as a dark shade over [-OVERHANG, 1 + OVERHANG]², so normal
    // voters outside the square show too. Computed on a grid of DENSITY_GRID points per unit and
    // smoothed up. DENSITY_TOP (the normal peak is 1.13) and higher get opacity DENSITY_ALPHA;
    // below, the opacity falls like density^DENSITY_GAMMA, which lifts the low densities.
    const DENSITY_GRID = 200;
    const DENSITY_EDGE = Math.round(OVERHANG * DENSITY_GRID);  // grid points outside on each side
    const DENSITY_SIZE = DENSITY_GRID + 2 * DENSITY_EDGE;
    const DENSITY_TOP = 1.2;
    const DENSITY_ALPHA = 0.8;
    const DENSITY_GAMMA = 0.6;
    // near-black with the opacity of each density level; more levels than 8 bits, as the power
    // makes the steps near 0 large
    const DENSITY_COLORS = Array.from({ length: 1024 }, (_, level) =>
      [20, 20, 20, 255 * DENSITY_ALPHA * (level / 1023) ** DENSITY_GAMMA]);
    // The whole shade, shown behind the square with CSS smoothing it up; the part inside the
    // square is drawn by draw(), between the diagram and the candidates.
    const densityCanvas = document.createElement("canvas");
    densityCanvas.width = densityCanvas.height = DENSITY_SIZE;
    Object.assign(densityCanvas.style, { pointerEvents: "none", visibility: "hidden" });
    canvas.before(densityCanvas);
    // up to half a level of noise per grid point, so that 256 levels show no rings where the
    // density is nearly flat; fixed, so the image does not flicker while the mouse moves
    const DITHER = Float32Array.from({ length: DENSITY_SIZE ** 2 }, () => Math.random() - 0.5);

    let candidates = [];  // [[x, y], ...] in the unit square, y pointing up
    let maxCandidates = 0;
    let pixels = 0;       // voters of pixel k (of pixels per axis) have median (k + 1/2) / pixels
    let method = null;    // name of the selected method
    let labels = {};      // method name -> label shown in the UI (FPTP, Borda, ...)
    let distribution = null;  // name of the selected voter distribution
    let spreadInfo = {};  // what the Beta voters keep the same for every pixel: {label, tex, description}
    let pixelMedian = null;  // what a pixel is: the "marginal" medians of its voters (along each
                             // axis) or their "geometric" median; the same point for normal voters
    let moving = null;    // {from, to, start}: the diagram is on its way between the two, since
                          // `start` (ms), from pixels drawn `from` of the way to their geometric
                          // median to `to` of it (0: at their medians along the axes, 1: there)
    let lookups = {};     // deviation -> /api/geometric: {pixels, outline}, for the points of a
                          // quarter of the square the pixel whose voters have their geometric
                          // median there, and the border of the coloured region
    let deviation = 0;    // mean absolute deviation of the voters from their pixel
    let scoreMethod = null;  // name of the method the categories slider belongs to
    let levels = 0;          // its number of scores on a ballot
    let voters = {};      // deviation -> {sigma, beta_params} from the backend, where
                          // beta_params is [a, b] along one axis, per pixel
    let hovered = [0.5, 0.5];  // point whose voters are shown in the strip and the shade
    let showDensity = false;   // their 2D density over the square, while hovering it (if shown at all)
    let regions = null;   // last computed win regions [{winner, path}], path a Path2D in the unit square
    let dragged = -1;     // index of the candidate being dragged
    let dragGrid = 0, finalGrid = 0;  // grid the backend traces regions on: while dragging, after
    let inFlight = false; // a request is on its way; at most one is, so a drag never queues up
    let queued = null;    // grid of the request to send once it is back (with the latest candidates)

    // Unit square has y up, the canvas has y down.
    const clamp = v => Math.min(1, Math.max(0, v));
    const toCanvas = ([x, y]) => [x * canvas.width, (1 - y) * canvas.height];
    function toUnit(event) {
      const box = canvas.getBoundingClientRect();
      return [clamp((event.clientX - box.left) / box.width), clamp(1 - (event.clientY - box.top) / box.height)];
    }

    function candidateAt(point) {
      const [px, py] = toCanvas(point);
      return candidates.findLastIndex(c => {
        const [x, y] = toCanvas(c);
        return Math.hypot(x - px, y - py) <= RADIUS + 6;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (regions) {
        ctx.save();
        ctx.setTransform(canvas.width, 0, 0, -canvas.height, 0, canvas.height);  // unit square, y up
        // A stroke in the fill colour covers the faint seams antialiasing leaves between neighbours.
        ctx.lineWidth = 1.5 / canvas.width;
        ctx.lineJoin = "round";
        for (const { winner, path } of regions) {
          ctx.fillStyle = ctx.strokeStyle = COLORS[winner] ?? "#000";  // winner -1: Condorcet cycle
          ctx.fill(path, "evenodd");  // holes are further rings; even-odd ignores their orientation
          ctx.stroke(path);
        }
        ctx.restore();
      }
      densityCanvas.style.visibility = showDensity ? "visible" : "hidden";  // the part around the square
      if (showDensity) {  // the part of the voter density inside the square
        ctx.imageSmoothingEnabled = true;  // smooth, unlike the diagram
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(densityCanvas, DENSITY_EDGE, DENSITY_EDGE, DENSITY_GRID, DENSITY_GRID,
          0, 0, canvas.width, canvas.height);
      }
      candidates.forEach((candidate, i) => {
        const [x, y] = toCanvas(candidate);
        ctx.beginPath();
        ctx.arc(x, y, RADIUS, 0, 2 * Math.PI);
        ctx.fillStyle = COLORS[i];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";
        ctx.stroke();
      });
    }

    // log Γ(z) for z > 0 (Lanczos, g = 7, with the reflection formula below 1/2)
    const LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
      -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    function lgamma(z) {
      if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
      z -= 1;
      let sum = LANCZOS[0];
      for (let i = 1; i < LANCZOS.length; i++) sum += LANCZOS[i] / (z + i);
      const t = z + 7.5;
      return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(sum);
    }

    // Voters of pixel k along one axis: median m (the pixel centre, as in the backend), pdf and a label.
    function voterDensity(k) {
      const m = (k + 0.5) / pixels;
      const { sigma, beta_params } = voters[deviation];
      if (distribution === "beta") {
        const [a, b] = beta_params[k];
        const logB = lgamma(a) + lgamma(b) - lgamma(a + b);
        return {
          m, text: `Beta(${a.toFixed(3)}, ${b.toFixed(3)})`,
          pdf: x => x <= 0 || x >= 1 ? null : Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log1p(-x) - logB),
        };
      }
      return {  // normal voters can leave the square
        m, text: `N(${m.toFixed(3)}, ${sigma.toFixed(3)}²)`,
        pdf: x => Math.exp(-0.5 * ((x - m) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI)),
      };
    }

    // A uPlot strip of the voter density along x, above the square, with density 0 at the bottom.
    function voterStrip() {
      let median = 0.5;
      // vertical lines at positions `at` along x, in canvas pixels
      function across(u, at, style, dash = []) {
        const { ctx, bbox } = u;
        ctx.save();
        ctx.strokeStyle = style;
        ctx.lineWidth = devicePixelRatio;
        ctx.setLineDash(dash.map(d => d * devicePixelRatio));
        for (const v of at) {
          const p = Math.round(u.valToPos(v, "x", true)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(p, bbox.top);
          ctx.lineTo(p, bbox.top + bbox.height);
          ctx.stroke();
        }
        ctx.restore();
      }
      // grey outside the square, where only normal voters go
      function shadeOutside(u) {
        const { ctx, bbox } = u;
        ctx.save();
        ctx.fillStyle = "#f6f6f6";
        for (const [from, to] of [[-OVERHANG, 0], [1, 1 + OVERHANG]]) {
          const [p, q] = [from, to].map(v => u.valToPos(v, "x", true));
          ctx.fillRect(Math.min(p, q), bbox.top, Math.abs(q - p), bbox.height);
        }
        ctx.restore();
      }
      const plot = new uPlot({
        width: 100, height: 100,  // set by layout()
        padding: [0, 0, 0, 0],
        legend: { show: false },
        cursor: { show: false, drag: { x: false, y: false } },
        select: { show: false },
        scales: {
          x: { time: false, auto: false, range: [-OVERHANG, 1 + OVERHANG] },
          y: { auto: false, range: [0, HEADROOM] },  // density over its peak
        },
        axes: [
          {
            side: 0, size: AXIS, gap: 3,
            splits: () => [0, 0.5, 1], values: (u, splits) => splits.map(String),
            font: "11px system-ui, sans-serif", stroke: "#888",
            grid: { show: false }, ticks: { size: 4, width: 1, stroke: "#ccc" },
          },
          { show: false },
        ],
        // pxAlign: 0 keeps sub-pixel positions; uPlot rounds to whole pixels by default, which
        // draws a nearly flat curve as steps
        series: [{}, { stroke: "#555", width: 1.5, fill: "rgba(0, 0, 0, 0.07)", points: { show: false }, pxAlign: 0 }],
        hooks: {
          drawClear: [shadeOutside],
          draw: [u => {
            across(u, [0, 1], "#ccc");  // edges of the square
            if (median !== null) across(u, [median], "#999", [4, 3]);
          }],
        },
      }, [POSITIONS, POSITIONS.map(() => null)], joint);
      return {
        plot,
        show({ m, pdf }) {
          median = m;
          // over the highest sample, so the whole curve fits; Beta with a or b < 1 is infinite
          // at the walls, but its samples are not
          const density = POSITIONS.map(pdf);
          const peak = Math.max(...density.filter(Number.isFinite));  // Beta is null outside
          plot.setData([POSITIONS, density.map(d => d === null || !(peak > 0) ? d : d / peak)]);
        },
        clear() {  // no voters to show
          median = null;
          plot.setData([POSITIONS, POSITIONS.map(() => null)]);
        },
      };
    }
    const stripX = voterStrip();

    // The 2D density of voters X, Y into densityCanvas. They are independent, so it is f(x) g(y).
    function fillDensity(x, y) {
      const along = ({ pdf }) => Array.from({ length: DENSITY_SIZE },
        (_, i) => pdf((i - DENSITY_EDGE + 0.5) / DENSITY_GRID) ?? 0);  // Beta is null outside
      const [f, g] = [along(x), along(y)];
      const top = DENSITY_COLORS.length - 1;
      const image = new ImageData(DENSITY_SIZE, DENSITY_SIZE);
      for (let row = 0; row < DENSITY_SIZE; row++) {
        const gy = g[DENSITY_SIZE - 1 - row];  // rows go top to bottom
        for (let col = 0; col < DENSITY_SIZE; col++) {
          const k = row * DENSITY_SIZE + col;
          const level = Math.round(top * Math.min(1, f[col] * gy / DENSITY_TOP) + DITHER[k]);
          image.data.set(DENSITY_COLORS[Math.min(top, Math.max(0, level))], 4 * k);
        }
      }
      densityCanvas.getContext("2d").putImageData(image, 0, 0);
    }

    // Pixels are drawn at the geometric median of their voters (Beta voters only: normal voters
    // have it at their pixel).
    const geometric = () => distribution === "beta" && pixelMedian === "geometric";

    // Picking what a pixel is moves the diagram there over MOVE ms instead of jumping: every
    // election travels on a straight line between the two points it can be drawn at. Not for
    // those who asked their system for less motion.
    const MOVE = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 700;

    // How far the pixels are drawn towards their geometric median right now, from 0 to 1.
    function shift() {
      if (!moving) return geometric() ? 1 : 0;
      const t = MOVE > 0 ? Math.min(1, (performance.now() - moving.start) / MOVE) : 1;
      return moving.from + (moving.to - moving.from) * t * t * (3 - 2 * t);  // eases in and out
    }

    // What a diagram of geometric medians needs at this deviation, /api/geometric, or null while
    // it is on its way: asked for once per deviation. When it arrives the candidates are moved
    // into the coloured region, and the voters shown again.
    function lookup() {
      const key = deviation;  // the slider may have moved by the time the answer is back
      if (!(key in lookups)) {
        lookups[key] = null;
        fetch(`/api/geometric?deviation=${key}`)
          .then(response => response.json())
          .then(answer => {
            lookups[key] = answer;
            if (confineAll()) compute();
            drawVoters();
          });
      }
      return lookups[key];
    }

    // Is the point inside the ring [x0, y0, x1, y1, ...]? (Even-odd: a ray to the right crosses
    // it an odd number of times.)
    function inside(ring, [x, y]) {
      let odd = false;
      for (let k = 0, j = ring.length - 2; k < ring.length; j = k, k += 2) {
        const [xk, yk, xj, yj] = [ring[k], ring[k + 1], ring[j], ring[j + 1]];
        if ((yk > y) !== (yj > y) && x < xk + (y - yk) * (xj - xk) / (yj - yk)) odd = !odd;
      }
      return odd;
    }

    // The point of the ring [x0, y0, x1, y1, ...] closest to the point.
    function closestOn(ring, [x, y]) {
      let best = null, distance = Infinity;
      for (let k = 0, j = ring.length - 2; k < ring.length; j = k, k += 2) {
        const [ax, ay, dx, dy] = [ring[j], ring[j + 1], ring[k] - ring[j], ring[k + 1] - ring[j + 1]];
        const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1));
        const [px, py] = [ax + t * dx, ay + t * dy];
        const d = (px - x) ** 2 + (py - y) ** 2;
        if (d < distance) [best, distance] = [[px, py], d];
      }
      return best;
    }

    // With pixels at geometric medians a candidate stays within the coloured region: a point
    // beyond its border goes to the closest point of it. Anywhere while the border is on its way.
    function confine(point) {
      const ring = geometric() ? lookup()?.outline : null;
      return !ring || inside(ring, point) ? point : closestOn(ring, point);
    }

    // Moves every candidate within the coloured region; true if one had to move.
    function confineAll() {
      let moved = false;
      candidates = candidates.map(candidate => {
        const kept = confine(candidate);
        moved ||= kept !== candidate;
        return kept;
      });
      return moved;
    }

    // The pixel [k, l] whose voters a point of the square shows: the one it lies in, or, with
    // pixels at geometric medians, the one whose voters have theirs closest to it. null if no
    // voters have it there (the strip along the walls), or while the lookup is on its way.
    function pixelAt(point) {
      const [i, j] = point.map(v => Math.min(pixels - 1, Math.floor(v * pixels)));
      if (!geometric()) return [i, j];
      const table = lookup()?.pixels;
      if (!table) return null;
      // the lookup has the quarter of the square next to the origin; the rest are its mirror images
      const side = pixels / 2;
      const mirror = (k, flip) => flip ? pixels - 1 - k : k;
      const found = table[mirror(i, i >= side) * side + mirror(j, j >= side)];
      if (found < 0) return null;
      return [mirror(Math.floor(found / pixels), i >= side), mirror(found % pixels, j >= side)];
    }

    // Voters of the hovered point along x (above the square) and in 2D over the square.
    // Redraws the square.
    function drawVoters() {
      const pixel = pixelAt(hovered);
      const at = `(${hovered.map(v => v.toFixed(3)).join(", ")})`;
      if (pixel) {
        const [x, y] = pixel.map(voterDensity);
        stripX.show(x);
        votersText.textContent = geometric()
          ? `Voters at ${at}, with medians (${x.m.toFixed(3)}, ${y.m.toFixed(3)}): X ~ ${x.text}, Y ~ ${y.text}`
          : `Voters at (${x.m.toFixed(3)}, ${y.m.toFixed(3)}): X ~ ${x.text}, Y ~ ${y.text}`;
        if (showDensity) fillDensity(x, y);
      } else {
        stripX.clear();
        votersText.textContent = lookups[deviation]
          ? `No voters have their geometric median at ${at}` : "";
        densityCanvas.getContext("2d").clearRect(0, 0, DENSITY_SIZE, DENSITY_SIZE);
      }
      draw();
    }

    // Place the square and the strip so that the strip's 0 and 1 line up with the square's edges.
    // The strip reaches OVERHANG beyond the square at both ends, so the square keeps that much
    // space around it, where the 2D density shows too, and DROP more between that and the strip.
    // A hidden strip takes no space.
    function layout() {
      const span = joint.clientWidth;          // length of the strip
      const side = span / (1 + 2 * OVERHANG);
      const thick = side * STRIP + AXIS;       // thickness of the strip with its labels
      const gap = side * OVERHANG;
      const top = showMarginal.checked ? thick + DROP : 0;  // of the square's surroundings
      stripX.plot.root.style.display = showMarginal.checked ? "" : "none";
      const place = (element, left, top, width, height) =>
        Object.assign(element.style, { left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` });
      place(canvas, gap, top + gap, side, side);
      place(densityCanvas, 0, top, span, span);
      place(stripX.plot.root, 0, 0, span, thick);
      stripX.plot.setSize({ width: span, height: thick });
      joint.style.height = `${top + span}px`;
    }
    new ResizeObserver(layout).observe(joint);
    showMarginal.addEventListener("change", layout);
    showJoint.addEventListener("change", () => {
      if (!showJoint.checked) showDensity = false;  // checking it again shows it from the next move
      draw();
    });

    // Win regions as a Path2D: every ring of every polygon, [x0, y0, x1, y1, ...] in the unit square.
    function toPath(polygons) {
      const path = new Path2D();
      for (const rings of polygons) {
        for (const ring of rings) {
          path.moveTo(ring[0], ring[1]);
          for (let k = 2; k < ring.length; k += 2) path.lineTo(ring[k], ring[k + 1]);
          path.closePath();
        }
      }
      return path;
    }

    // What an answer depends on besides the candidates' positions and the sliders. An answer to
    // other settings (or to a candidate added or removed since, whose colours shifted) is not drawn;
    // one to an older slider value is, so sliding it shows the newest diagram it can, like a drag.
    const settings = () => JSON.stringify([method, distribution, pixelMedian, candidates.length]);

    // Ask the backend for the win regions, traced on `grid` points per axis. While an answer is
    // on its way, only remember that another is needed: it is asked for as soon as the answer is
    // back, with the candidates as they are then, so a drag shows the newest positions it can.
    function compute(grid = finalGrid) {
      if (!method) return;
      if (candidates.length < 2) {
        message.textContent = "Add at least 2 candidates.";
        return;
      }
      if (inFlight) {
        queued = grid;
        return;
      }
      request(grid);
    }

    async function request(grid) {
      inFlight = true;
      if (moving && performance.now() - moving.start >= MOVE) moving = null;  // it has arrived
      if (moving) grid = dragGrid;  // on its way: the coarser grid, like a drag
      const part = shift();
      const asked = settings(), sliders = [deviation, levels];
      if (grid === finalGrid) message.textContent = `Computing ${labels[method]}…`;
      const start = performance.now();
      try {
        const response = await fetch("/api/regions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            candidates, method, distribution, deviation, levels, grid,
            pixel_median: part > 0 ? "geometric" : "marginal", shift: part,
          }),
        });
        if (!response.ok) throw new Error(await response.text());
        const answer = await response.json();
        if (asked === settings()) {
          regions = answer.regions.map(({ winner, polygons }) => ({ winner, path: toPath(polygons) }));
          draw();
          describe(...sliders, Math.round(performance.now() - start), Math.round(answer.ms));
        }
      } catch (error) {
        if (asked === settings()) message.textContent = `Error: ${error.message}`;
      } finally {
        inFlight = false;
        if (queued !== null) {
          const next = queued;
          queued = null;
          compute(next);
        } else if (moving) {
          compute();  // the next step of the move; the last one is on the fine grid
        }
      }
    }

    // What the diagram shows, and how long it took (round trip, and computing it on the backend).
    function describe(deviation, levels, total, server) {
      const tail = ` · ${candidates.length} candidates · ${total} ms (${server} ms computing)`;
      let name = labels[method];
      if (method === scoreMethod) name += `, ${levels} categories`;
      if (method === "voronoi") {  // nearest candidate, no voters involved but for where it is drawn
        const where = geometric() ? " · only where voters have their geometric median" : "";
        message.textContent = `${name}${where}${tail}`;
      } else if (distribution === "beta") {
        const formula = document.createElement("span");
        typeset(formula, spreadInfo);
        formula.title = spreadInfo.description;
        const where = pixelMedian === "geometric" ? ", pixels at their geometric median" : "";
        message.replaceChildren(`${name} · beta voters, deviation ${deviation}, `, formula, " fixed" + where + tail);
      } else {
        message.textContent = `${name} · ${distribution} voters, deviation ${deviation}${tail}`;
      }
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;  // left button only, right-click removes
      const point = toUnit(event);
      dragged = candidateAt(point);
      if (dragged === -1) {
        if (candidates.length >= maxCandidates) {
          message.textContent = `At most ${maxCandidates} candidates.`;
          return;
        }
        candidates.push(confine(point));
        dragged = candidates.length - 1;
      }
      canvas.setPointerCapture(event.pointerId);  // keep getting moves outside the canvas
      showDensity = false;
      draw();
    });

    canvas.addEventListener("pointermove", event => {
      hovered = toUnit(event);
      if (dragged !== -1) {
        candidates[dragged] = confine(hovered);
        compute(dragGrid);  // follow the drag on a coarser grid; the drop asks for the fine one
      }
      showDensity = dragged === -1 && showJoint.checked;  // not while dragging, so the diagram stays visible
      drawVoters();
    });

    canvas.addEventListener("pointerleave", () => {
      showDensity = false;
      draw();
    });

    function drop() {
      if (dragged === -1) return;
      dragged = -1;
      compute();
    }
    canvas.addEventListener("pointerup", drop);
    canvas.addEventListener("pointercancel", drop);

    canvas.addEventListener("contextmenu", event => {
      event.preventDefault();
      const i = candidateAt(toUnit(event));
      if (i === -1) return;
      candidates.splice(i, 1);
      regions = null;  // colours follow the index, which just shifted
      draw();
      compute();
    });

    // Typeset a {label, tex} option with KaTeX, or show the plain label if it fails.
    function typeset(element, { label, tex }) {
      try {
        katex.render(tex, element, { throwOnError: true });
      } catch {
        element.textContent = label;
      }
    }

    // A row of buttons of which one is active; picking one recomputes the diagram.
    // options: [{name, label, tex, description}], all but name optional. Rows in `group`
    // share the one active button.
    function choices(row, options, pick, group = [row]) {
      for (const { name, label = name, tex, description = "" } of options) {
        const button = document.createElement("button");
        if (tex) typeset(button, { label, tex });
        else button.textContent = label;
        button.title = description;
        button.addEventListener("click", () => {
          pick(name);
          for (const r of group)
            for (const b of r.querySelectorAll("button")) b.classList.toggle("active", b === button);
          compute();
        });
        row.append(button);
      }
    }

    // The choice of what a pixel is only applies to Beta voters.
    function updatePixelMedians() {
      for (const button of pixelMedians.querySelectorAll("button")) button.disabled = distribution !== "beta";
    }

    // The categories slider only applies to its method.
    function pickMethod(name) {
      method = name;
      levelsSlider.disabled = method !== scoreMethod;
    }


    // Start: default candidates, distributions and methods (names, tooltips) come from the backend.
    const config = await (await fetch("/api/config")).json();
    candidates = config.candidates;
    maxCandidates = config.max_candidates;
    pixels = config.pixels;
    dragGrid = config.drag_grid;
    finalGrid = config.final_grid;
    spreadInfo = config.spread;
    voters = Object.fromEntries(config.voters.map(({ deviation, ...rest }) => [deviation, rest]));
    choices(distributions, config.distributions, name => {
      distribution = name;
      updatePixelMedians();
      confineAll();
      drawVoters();
    });
    // The slider picks an index into the offered deviations, so the values stay exact. Moving it
    // updates the voters shown and recomputes the diagram on the coarser grid, like a drag;
    // letting go asks for the fine one.
    function pickDeviation() {
      deviation = config.deviations[deviationSlider.valueAsNumber];
      deviationValue.textContent = String(deviation);
      deviationSlider.title =
        `Voters at a mean distance of ${deviation} from their pixel along each axis (at the centre pixel for Beta)`;
    }
    Object.assign(deviationSlider, { min: 0, max: config.deviations.length - 1, step: 1 });
    deviationSlider.value = config.deviations.indexOf(config.deviation);
    deviationSlider.addEventListener("input", () => { pickDeviation(); confineAll(); drawVoters(); compute(dragGrid); });
    deviationSlider.addEventListener("change", () => compute());
    // The categories slider is the number of scores of a score ballot. It recomputes like the
    // deviation slider.
    scoreMethod = config.score;
    function pickLevels() {
      levels = levelsSlider.valueAsNumber;
      levelsValue.textContent = `${levels} (scores 0 to ${levels - 1})`;
    }
    Object.assign(levelsSlider, { max: config.max_levels, value: config.levels });
    levelsSlider.title = "Number of scores on a ballot: the top one for the closest candidate, 0 " +
      "for the farthest, and the others in proportion to their distance between the two. " +
      "For Score only.";
    levelsSlider.addEventListener("input", () => { pickLevels(); compute(dragGrid); });
    levelsSlider.addEventListener("change", () => compute());
    choices(pixelMedians, config.pixel_medians, name => {
      const from = shift();  // where the diagram is now, also in the middle of a move
      pixelMedian = name;
      const to = geometric() ? 1 : 0;
      moving = from === to ? null : { from, to, start: performance.now() };
      confineAll();
      drawVoters();
    });
    choices(methods, config.methods, pickMethod, [methods, ideals]);
    choices(ideals, config.ideals, pickMethod, [methods, ideals]);
    labels = Object.fromEntries([...config.methods, ...config.ideals].map(({ name, label }) => [name, label]));
    distribution = config.distributions[0].name;
    distributions.querySelector("button").classList.add("active");
    pixelMedian = config.pixel_median;
    pixelMedians.querySelectorAll("button")[config.pixel_medians.findIndex(info => info.name === pixelMedian)]
      .classList.add("active");
    pickDeviation();
    pickLevels();
    pickMethod(null);  // none yet: the categories slider waits for its method
    updatePixelMedians();
    draw();
    drawVoters();
  </script>
</body>
</html>
